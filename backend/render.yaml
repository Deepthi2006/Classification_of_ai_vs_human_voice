services:
  - type: web
    name: ai-voice-detection
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    pythonVersion: "3.10"
    envVars:
      - key: X_API_KEY
        value: test123
